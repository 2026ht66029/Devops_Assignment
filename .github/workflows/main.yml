name: ACEest CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Build and syntax check
        run: python -m compileall -q app.py aceest tests

      - name: Lint
        run: ruff check .

      - name: Run host tests
        run: pytest

      - name: Build test image
        run: docker build --target test --tag aceest:test .

      - name: Run tests inside container
        run: docker run --rm aceest:test

      - name: Build runtime image
        run: docker build --target runtime --tag aceest:${{ github.sha }} .

      - name: Smoke test runtime container
        run: |
          docker run --detach --rm --name aceest-ci --publish 8000:8000 aceest:${{ github.sha }}
          for attempt in 1 2 3 4 5; do
            curl --fail --silent http://127.0.0.1:8000/health && exit 0
            sleep 2
          done
          docker logs aceest-ci
          exit 1

      - name: Stop smoke-test container
        if: always()
        run: docker stop aceest-ci || true
