[tool.pytest.ini_options]
addopts = "-q --cov=aceest --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
pythonpath = ["."]
# Explicitly set the coverage database location.
# pytest-cov will use this path when saving coverage data.

[tool.coverage.run]
data_file = "/tmp/coverage/.coverage"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
